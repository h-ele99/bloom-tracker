<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Figtree:wght@400;500;600;700&display=swap">
<style>
  :root{
    --pink:#c14a6f; --pink-mid:#e2678c; --pink-300:#ffc2d1; --pink-200:#ffdfe6; --pink-100:#fff1f4;
    --cream:#fdf6f5; --surface:#f7e6e6; --track:#f2dedd;
    --ink:#201e1d; --ink-soft:rgba(32,30,29,.55); --ink-faint:rgba(32,30,29,.45); --ink-hair:rgba(32,30,29,.12);
    --sage:#728157; --sage-300:#ccdbb2; --sage-100:#f0fae1; --sage-800:#3d472b;
    --danger:#9a3454;
    --wash-1:#fbeceb; --wash-2:#f3e7e6; --wash-3:#eedcda;
    --display:'Caprasimo',Georgia,serif;
    --body:'Figtree',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--wash-2)}
  body{
    font-family:var(--body); color:var(--ink);
    background:radial-gradient(120% 80% at 20% 0%, var(--wash-1) 0%, var(--wash-2) 60%, var(--wash-3) 100%);
    background-attachment:fixed;
  }
  ::-webkit-scrollbar{width:0;height:0}
  button{font-family:inherit;-webkit-appearance:none;appearance:none}
  input{font-family:inherit}
  a{color:var(--danger)}

  .shell{min-height:100vh;min-height:100dvh;display:flex;justify-content:center}
  .card{
    width:100%;max-width:460px;height:100vh;height:100dvh;
    background:var(--cream);display:flex;flex-direction:column;position:relative;overflow:hidden;
  }
  @media (min-width:560px){
    .shell{padding:40px 16px;align-items:flex-start}
    .card{height:min(874px,calc(100vh - 80px));border-radius:40px;
      box-shadow:0 30px 70px rgba(46,43,37,.16),0 0 0 1px rgba(46,43,37,.06);margin:0 auto}
  }

  .topbar{padding:calc(env(safe-area-inset-top,0px) + 20px) 22px 12px;display:flex;align-items:flex-end;gap:10px;flex:none}
  .kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--pink);font-weight:600}
  .title{font-family:var(--display);font-size:26px;line-height:1.14;letter-spacing:-.01em;margin-top:3px;text-wrap:balance}
  .gear-btn{flex:none;width:30px;height:30px;border-radius:50%;border:none;cursor:pointer;background:var(--surface);display:flex;align-items:center;justify-content:center}
  .gear-btn svg{width:15px;height:15px}

  .scroll{flex:1;overflow-y:auto;padding:8px 22px 150px}

  .card-block{border-radius:32px;padding:20px;background:var(--surface);display:flex;flex-direction:column;gap:12px}
  .row-between{display:flex;align-items:baseline;justify-content:space-between}
  .h3{font-family:var(--display);font-size:17px}

  .hero{border-radius:32px;padding:22px;box-shadow:0 3px 10px rgba(46,43,37,.10)}
  .hero-ring{display:flex;align-items:center;gap:18px}
  .ring-wrap{position:relative;width:126px;height:126px;flex:none;border-radius:50%}
  .ring-inner{position:absolute;inset:15px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
  .ring-pct{font-family:var(--display);font-size:25px;line-height:1}
  .eyebrow{font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .eyebrow-lg{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
  .amount-lg{font-family:var(--display);font-size:29px;line-height:1;letter-spacing:-.02em}

  .bars-row{display:flex;align-items:flex-end;gap:3px;height:64px}
  .bars-row > div{flex:1;min-width:0;border-radius:999px}
  .axis-row{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;color:var(--ink-faint)}

  .cat-line{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .cat-line .dot{width:9px;height:9px;flex:none;border-radius:50%}
  .cat-line .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cat-line .amt{font-weight:600;font-variant-numeric:tabular-nums}

  .track{height:7px;border-radius:999px;background:var(--track);overflow:hidden}
  .track > div{height:100%;border-radius:999px;transition:width .6s cubic-bezier(.22,1,.36,1)}

  .btn-pill{border:none;cursor:pointer;border-radius:999px;font-family:var(--display);display:flex;align-items:center;justify-content:center;gap:8px}
  .btn-ghost{border:1px solid var(--ink-hair);background:transparent;cursor:pointer;border-radius:999px;font-family:var(--display);color:var(--ink)}
  .btn-ghost:hover, .btn-pill.primary:hover{filter:brightness(.96)}

  .fab{position:absolute;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);width:60px;height:60px;border-radius:50%;
    border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--pink);color:var(--cream);
    box-shadow:0 10px 24px rgba(154,52,84,.34);z-index:30;transition:transform .1s ease,background .15s ease}
  .fab:hover{background:var(--danger)} .fab:active{transform:scale(.95)}
  .fab svg{width:26px;height:26px}

  .tabbar{flex:none;position:relative;z-index:20;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);
    background:rgba(253,246,245,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-top:1px solid var(--ink-hair);display:flex;gap:2px}
  .tab-btn{flex:1;min-width:0;border:none;background:transparent;cursor:pointer;padding:8px 2px 6px;display:flex;
    flex-direction:column;align-items:center;gap:4px;border-radius:16px;color:var(--ink-faint)}
  .tab-btn:hover{background:rgba(32,30,29,.05)}
  .tab-btn.active{color:var(--pink)}
  .tab-btn svg{width:21px;height:21px}
  .tab-btn span{font-size:10px;font-weight:600}

  .filter-chip{border:1px solid var(--ink-hair);cursor:pointer;padding:7px 14px;border-radius:999px;font-size:12.5px;font-weight:600;background:transparent;color:var(--ink)}
  .filter-chip.active{background:var(--pink);color:var(--cream);border-color:var(--pink)}

  .txn-row{border-radius:24px;padding:14px 16px;display:flex;align-items:center;gap:13px;background:var(--surface)}
  .icon-badge{width:36px;height:36px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .icon-badge svg{width:17px;height:17px;color:var(--ink)}
  .txn-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .txn-sub{font-size:11.5px;color:var(--ink-soft);margin-top:1px}
  .txn-amt{font-family:var(--display);font-size:16px;flex:none;font-variant-numeric:tabular-nums}
  .delete-btn{flex:none;border:none;background:transparent;cursor:pointer;padding:6px;margin:-6px -8px -6px 0;color:var(--ink-faint);display:flex;align-items:center;justify-content:center;border-radius:8px}
  .delete-btn:hover{color:var(--danger);background:rgba(154,52,84,.08)}
  .date-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);padding:8px 2px 0;font-weight:600}
  @keyframes popIn{0%{transform:scale(.92);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
  .fresh{animation:popIn .4s cubic-bezier(.22,1,.36,1); background:var(--pink-100) !important}

  .budget-name{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .warn-line{font-size:11.5px;color:var(--danger);display:flex;align-items:center;gap:5px}
  .warn-line svg{width:13px;height:13px}

  .insight-card{border-radius:28px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
  .insight-head{display:flex;align-items:center;gap:9px}
  .insight-head svg{width:17px;height:17px}
  .insight-kicker{font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;opacity:.88}
  .insight-title{font-family:var(--display);font-size:20px;line-height:1.2;letter-spacing:-.01em;text-wrap:balance}
  .insight-body{font-size:13px;line-height:1.5;opacity:.92}

  .sheet-backdrop{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
  .sheet-scrim{position:absolute;inset:0;background:rgba(46,43,37,.42);animation:fadeIn .22s ease}
  .sheet{position:relative;border-radius:36px 36px 0 0;background:var(--cream);padding:14px 22px calc(env(safe-area-inset-bottom,0px) + 26px);
    box-shadow:0 -12px 32px rgba(46,43,37,.22);animation:sheetUp .32s cubic-bezier(.22,1,.36,1);max-height:88%;overflow-y:auto}
  .grabber{width:44px;height:5px;border-radius:999px;background:var(--ink-hair);margin:0 auto 14px}
  @keyframes sheetUp{from{transform:translateY(102%)}to{transform:translateY(0)}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .chip-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .chip-btn{border:1px solid var(--ink-hair);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:20px;
    padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px}
  .chip-btn svg{width:18px;height:18px}
  .chip-btn span{font-size:11.5px;font-weight:600}
  .chip-btn.active{border-color:var(--pink);background:var(--pink-200)}
  .chip-row-scroll{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
  .chip-row-btn{border:1px solid var(--ink-hair);background:var(--surface);color:var(--ink);cursor:pointer;border-radius:999px;
    padding:9px 15px;display:flex;align-items:center;gap:7px;white-space:nowrap;flex:none}
  .chip-row-btn svg{width:15px;height:15px}
  .chip-row-btn.active{border-color:var(--pink);background:var(--pink-200)}

  .keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
  .key-btn{border:none;background:var(--surface);cursor:pointer;border-radius:22px;padding:15px 0;font-family:var(--display);
    font-size:21px;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .key-btn:hover{background:var(--track)} .key-btn:active{transform:scale(.96)}

  .sheet-actions{display:flex;gap:10px;margin-top:14px}
  .btn-cancel{flex:none;padding:15px 22px;font-size:14px}
  .btn-save{flex:1;padding:15px 0;font-size:15px;background:var(--pink);color:var(--cream)}
  .btn-save svg{width:17px;height:17px}

  .recent-btn{border:1px solid var(--ink-hair);background:var(--surface);cursor:pointer;border-radius:999px;padding:11px 16px;
    display:flex;align-items:center;gap:11px;text-align:left;width:100%}
  .recent-btn:hover{border-color:var(--pink)}
  .recent-badge{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .recent-badge svg{width:15px;height:15px}

  .field-label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;display:block;margin-bottom:6px}
  .field-input{width:100%;border:1px solid var(--ink-hair);border-radius:16px;padding:12px 14px;font-size:16px;background:var(--cream);color:var(--ink)}
  .cap-input{width:88px;border:1px solid var(--ink-hair);border-radius:12px;padding:8px 10px;font-size:13.5px;text-align:right;background:var(--cream);color:var(--ink)}
  .pill-option{border:1px solid var(--ink-hair);background:transparent;color:var(--ink);cursor:pointer;padding:9px 15px;border-radius:999px;font-size:12.5px;font-weight:600}
  .pill-option.active{background:var(--pink);color:var(--cream);border-color:var(--pink)}

  .empty-state{padding:32px 4px;text-align:center;font-size:13px;color:var(--ink-soft)}
  .pies-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .pie-card{background:var(--surface);border-radius:22px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
  .pie-card svg path{transition:opacity .15s ease}
  .pie-card svg path:active{opacity:.75}
  .pie-name{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .pie-info{font-size:11px;color:var(--ink-faint);min-height:15px}
  .loading{flex:1;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:var(--pink)}
  @media (prefers-reduced-motion:reduce){ *{animation-duration:.001ms !important} }
</style>
</head>
<body>

<div class="shell"><div class="card" id="card">
  <div class="loading">Bloom</div>
</div></div>

<script>
(function(){
  "use strict";

  var CATS = ['Saving','Rent & Utilities','Other fixed expenses','Emergency','Travel','Food','Clothes','Fun budget','Family','Life essentials','Eating out'];
  // 11 distinct hues validated with the dataviz skill's categorical-palette checker
  // against this app's card surface (#f7e6e6): lightness band + chroma floor pass
  // for all 11, and no two are anywhere near each other (the old palette had four
  // exact duplicate pairs). Beyond ~8 series a categorical palette can't clear every
  // pairwise colorblind-separation check at once (see the skill's own reference
  // palette, which only clears all-pairs for its first 3 of 8 slots) -- the small
  // residual risk on the closest pairs is why every place these colors appear also
  // shows the category's icon and name, never color alone.
  var CAT_META = {
    'Saving':{icon:'sprout', color:'#ab2b56', tint:'#f0dbe2'},
    'Rent & Utilities':{icon:'home', color:'#d24e2d', tint:'#f1dfda'},
    'Other fixed expenses':{icon:'repeat', color:'#b88a1e', tint:'#f2ebd9'},
    'Emergency':{icon:'alert-circle', color:'#92be2d', tint:'#eaf1da'},
    'Travel':{icon:'plane', color:'#377915', tint:'#e1f2d9'},
    'Food':{icon:'shopping-basket', color:'#29a37a', tint:'#dbf0e9'},
    'Clothes':{icon:'shopping-bag', color:'#128da5', tint:'#d7eff4'},
    'Fun budget':{icon:'sparkles', color:'#2775b9', tint:'#dae6f1'},
    'Family':{icon:'family', color:'#6339c6', tint:'#e2dcef'},
    'Life essentials':{icon:'heart', color:'#a329a3', tint:'#f0dbf0'},
    'Eating out':{icon:'utensils', color:'#be2d81', tint:'#f1dae7'}
  };
  // Reference baseline from the Targets tab of the linked budget_2026 spreadsheet: monthly income
  // this app assumes for its own local Target(\u20AC) math, and each category's % share of it. The
  // spreadsheet itself recomputes targets from each month's real income -- this local copy is a
  // simplified, fixed-income stand-in so the app can show budget context without an income-entry flow.
  var MONTHLY_INCOME = 2700;
  var CATEGORY_PCT = {
    'Saving':30, 'Rent & Utilities':32, 'Other fixed expenses':1, 'Emergency':7, 'Travel':5,
    'Food':5, 'Clothes':3, 'Fun budget':4, 'Family':5, 'Life essentials':5, 'Eating out':3
  };
  var PAYMENT_METHODS = ['ING','Intesa','BPER','Fineco','IBKR','CREDITO','DEBITO','Cash'];
  var STORAGE_KEY = 'bloom-tracker-v2';
  // Apps Script Web App endpoint (doPost) that appends a row to the Transactions tab of
  // budget_2026 -- see Settings -> Google Sheet sync. Token must match the TOKEN constant
  // pasted into that script; it's a lightweight shared secret, not real auth.
  var SYNC_TOKEN = 'pcI_koSNTOFM1dXwEQAxL0Og1o63np9y';
  var MONTH_ABBR = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var MONTH_ABBR_CAP = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var MONTH_FULL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  var DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // ---------- helpers ----------
  function pad2(n){ return String(n).length<2 ? '0'+n : ''+n; }
  function iso(y,m,d){ return y+'-'+pad2(m+1)+'-'+pad2(d); }
  function daysInMonth(y,m){ return new Date(y,m+1,0).getDate(); }
  function round2(n){ return Math.round(n*100)/100; }
  function fmt(n){ return '\u20AC' + Number(n).toLocaleString('en-IE',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmt0(n){ return '\u20AC' + Math.round(Number(n)).toLocaleString('en-IE'); }
  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function greeting(){ var h=new Date().getHours(); if(h<5) return 'Good night'; if(h<12) return 'Good morning'; if(h<18) return 'Good afternoon'; return 'Good evening'; }
  function dateLabel(dstr){
    var d = new Date(dstr+'T00:00:00'); var now = new Date();
    var startOf = function(x){ return new Date(x.getFullYear(),x.getMonth(),x.getDate()).getTime(); };
    var diff = Math.round((startOf(now)-startOf(d))/86400000);
    if(diff===0) return 'Today \u00B7 ' + d.getDate() + ' ' + MONTH_ABBR_CAP[d.getMonth()];
    if(diff===1) return 'Yesterday';
    return DAY_NAMES[d.getDay()] + ' \u00B7 ' + d.getDate() + ' ' + MONTH_ABBR_CAP[d.getMonth()];
  }

  // ---------- state ----------
  var state = null;

  // Baked-in default so a wiped/fresh browser storage still points at the right Sheet
  // without having to re-paste it -- change this if you ever redeploy to a new /exec URL.
  var DEFAULT_SYNC_URL = 'https://script.google.com/macros/s/AKfycbxg74ZeQgrHTvgHrzSFz5z5z_yJPbJlHJijoRNoW0KDSAzPkdikf14r2joJv8bRL73a/exec';
  function defaultState(){
    var pct = {}; CATS.forEach(function(c){ pct[c]=CATEGORY_PCT[c]; });
    return {
      settings:{dashboardLayout:'ring', pinkIntensity:'bold', syncUrl:DEFAULT_SYNC_URL},
      monthlyIncome:MONTHLY_INCOME, categoryPct:pct, expenses:[],
      migratedRemoveDemoData: true
    };
  }

  // One-time cleanup: earlier versions of this app seeded ~6 months of example transactions
  // so the app didn't look empty on first use. Anyone whose local data still has that seed
  // data mixed in gets it stripped once, on the first load after this change -- anything
  // genuinely dated before Sep 2026 that a user logs later (e.g. via the date field) is safe,
  // since this only ever runs once per device.
  var DEMO_DATA_CUTOFF = '2026-09-01';
  function loadState(){
    try{
      var raw = localStorage.getItem(STORAGE_KEY);
      if(raw){
        var parsed = JSON.parse(raw);
        if(parsed && parsed.expenses){
          if(!parsed.migratedRemoveDemoData){
            parsed.expenses = parsed.expenses.filter(function(e){ return e.date >= DEMO_DATA_CUTOFF; });
            parsed.migratedRemoveDemoData = true;
            persist(parsed);
          }
          return parsed;
        }
      }
    }catch(e){}
    var fresh = defaultState();
    persist(fresh);
    return fresh;
  }
  function persist(s){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }catch(e){} }

  // ---------- ui (ephemeral) state ----------
  function todayIso(){ var n = new Date(); return iso(n.getFullYear(), n.getMonth(), n.getDate()); }
  function newId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }
  var ui = {
    tab:'dash', sheetOpen:false, settingsOpen:false, adjustOpen:false,
    amount:'', date:todayIso(), category:CATS[0], supplier:'', paymentMethod:PAYMENT_METHODS[0], comment:'',
    historyFilter:'All', freshId:null, adjustDraft:null, settingsDraft:null, syncStatus:null, pieSelection:{}
  };

  // ---------- computations ----------
  function monthTotalsByCategory(expenses, year, monthIndex, throughDay){
    var lastDay = throughDay || daysInMonth(year, monthIndex);
    var start = iso(year, monthIndex, 1), end = iso(year, monthIndex, lastDay);
    var map = {}; CATS.forEach(function(c){ map[c]=0; });
    expenses.forEach(function(e){ if(e.date>=start && e.date<=end) map[e.category] = (map[e.category]||0) + e.amount; });
    return map;
  }
  function computeDashboard(){
    var now = new Date(), year = now.getFullYear(), monthIndex = now.getMonth(), today = now.getDate();
    var lastDay = daysInMonth(year, monthIndex);
    var catMap = monthTotalsByCategory(state.expenses, year, monthIndex, today);
    var spent = round2(CATS.reduce(function(a,c){ return a+catMap[c]; },0));
    var budget = state.monthlyIncome;
    var pct = Math.min(100, (spent/budget)*100);

    var rentDays = {};
    state.expenses.forEach(function(e){
      if(e.category==='Rent & Utilities' && e.date>=iso(year,monthIndex,1) && e.date<=iso(year,monthIndex,today)){
        rentDays[new Date(e.date+'T00:00:00').getDate()] = true;
      }
    });
    var dayTotals = {};
    state.expenses.forEach(function(e){
      if(e.category!=='Rent & Utilities' && e.date>=iso(year,monthIndex,1) && e.date<=iso(year,monthIndex,today)){
        var dd = new Date(e.date+'T00:00:00').getDate();
        dayTotals[dd] = (dayTotals[dd]||0) + e.amount;
      }
    });
    var scaleMax = 1; Object.keys(dayTotals).forEach(function(k){ if(dayTotals[k]>scaleMax) scaleMax = dayTotals[k]; });

    var days = [];
    for(var d=1; d<=lastDay; d++){
      if(d>today){ days.push({day:d, kind:'future', total:0}); continue; }
      if(rentDays[d]){ days.push({day:d, kind:'rent', total:null}); continue; }
      var total = dayTotals[d] || 0;
      days.push({day:d, kind: total===0 ? 'zero' : (d===today ? 'today' : 'spend'), total:total, scaleMax:scaleMax});
    }

    var cats = CATS.map(function(name){
      return { name:name, amount: catMap[name]||0, pct: spent>0 ? Math.round(((catMap[name]||0)/spent)*100) : 0, color: CAT_META[name].color };
    }).filter(function(c){ return c.amount>0; }).sort(function(a,b){ return b.amount-a.amount; });

    return { spent:spent, budget:budget, pct:round2(pct), daysLeft: lastDay-today,
      avgPerDay: today>0 ? round2(spent/today) : 0, days:days, categories:cats,
      monthLabel: MONTH_FULL[monthIndex], monthAbbr: MONTH_ABBR[monthIndex], lastDay: lastDay };
  }

  function computeBudgets(){
    var now = new Date();
    var catMap = monthTotalsByCategory(state.expenses, now.getFullYear(), now.getMonth());
    var categories = CATS.map(function(name){
      var pctShare = state.categoryPct[name] || 0;
      var cap = round2(state.monthlyIncome * pctShare / 100);
      var spent = catMap[name] || 0;
      var r = cap>0 ? spent/cap : 0;
      return { name:name, spent: round2(spent), cap:cap, pctShare:pctShare, pct: Math.min(100, round2(r*100)),
        color: r>1 ? '#9a3454' : r>0.85 ? '#c14a6f' : '#e2678c', warn: r>1,
        warnText: r>1 ? (fmt(round2(spent-cap)) + ' over \u2014 trim one before next month') : '' };
    });
    return { monthlyIncome: state.monthlyIncome, categories: categories };
  }

  function computeInsights(dash){
    var now = new Date(), year = now.getFullYear(), monthIndex = now.getMonth(), today = now.getDate();
    var thisMonth = monthTotalsByCategory(state.expenses, year, monthIndex, today);
    var prevRef = new Date(year, monthIndex-1, 1);
    var cutoff = Math.min(today, daysInMonth(prevRef.getFullYear(), prevRef.getMonth()));
    var lastMonth = monthTotalsByCategory(state.expenses, prevRef.getFullYear(), prevRef.getMonth(), cutoff);
    var spent = CATS.reduce(function(a,c){ return a+thisMonth[c]; },0);
    var spentLast = CATS.reduce(function(a,c){ return a+lastMonth[c]; },0);
    var pacingDelta = spentLast>0 ? round2(((spent-spentLast)/spentLast)*100) : 0;

    var insights = [];
    insights.push({ kicker:'Pacing', icon:'gauge', tone:'hero',
      head: fmt0(Math.max(0, dash.budget-spent)) + ' left with ' + (daysInMonth(year,monthIndex)-today) + ' day' + ((daysInMonth(year,monthIndex)-today)===1?'':'s') + ' to go',
      body: pacingDelta===0 ? "You're spending about the same as this time last month." :
        "You're running about " + Math.abs(pacingDelta) + "% " + (pacingDelta<0?'under':'over') + " where you were this time last month." });

    var movers = CATS.map(function(cat){ return { cat:cat, delta: round2((thisMonth[cat]||0)-(lastMonth[cat]||0)) }; })
      .filter(function(m){ return Math.abs(m.delta)>=5; })
      .sort(function(a,b){ return Math.abs(b.delta)-Math.abs(a.delta); }).slice(0,2);
    movers.forEach(function(m){
      var down = m.delta<0;
      insights.push({ kicker:m.cat, icon:CAT_META[m.cat].icon, tone: down?'surface':'pink-100',
        head: m.cat + ' is ' + (down?'down':'up') + ' ' + fmt0(Math.abs(m.delta)),
        body: fmt0(Math.abs(m.delta)) + (down?' less':' more') + ' than this time last month, at the same point in the cycle.' });
    });

    return insights;
  }

  // ---------- svg chart helpers ----------
  function polarPoint_(cx, cy, r, angleDeg){
    var rad = (angleDeg - 90) * Math.PI / 180; // 0deg = 12 o'clock, clockwise
    return [cx + r*Math.cos(rad), cy + r*Math.sin(rad)];
  }
  // SVG path for one pie wedge from startDeg to endDeg (a full 0-360 sweep needs two arcs,
  // since a single <path> arc command can't describe a complete circle).
  function pieSlicePath(cx, cy, r, startDeg, endDeg){
    if(endDeg - startDeg >= 359.99){
      var p1 = polarPoint_(cx, cy, r, startDeg), pMid = polarPoint_(cx, cy, r, startDeg+180);
      return 'M'+p1[0]+','+p1[1]+' A'+r+','+r+' 0 1,1 '+pMid[0]+','+pMid[1]+' A'+r+','+r+' 0 1,1 '+p1[0]+','+p1[1]+' Z';
    }
    var start = polarPoint_(cx, cy, r, startDeg), end = polarPoint_(cx, cy, r, endDeg);
    var largeArc = (endDeg - startDeg) > 180 ? 1 : 0;
    return 'M'+cx+','+cy+' L'+start[0]+','+start[1]+' A'+r+','+r+' 0 '+largeArc+',1 '+end[0]+','+end[1]+' Z';
  }
  function buildDonutGradient(categories){
    var acc=0; var stops = categories.map(function(c){ var seg=c.color+' '+acc+'% '+(acc+c.pct)+'%'; acc+=c.pct; return seg; });
    if(acc<100) stops.push('#f2dedd '+acc+'% 100%');
    return 'conic-gradient(' + stops.join(',') + ')';
  }

    'trending-up': '<polyline points="3,17 9,11 13,15 21,5"/><polyline points="15,5 21,5 21,11"/>',
    'receipt-text': '<path d="M6 2 H18 V20 L16 18 L14 20 L12 18 L10 20 L8 18 L6 20 Z"/><line x1="8.5" y1="7" x2="15.5" y2="7"/><line x1="8.5" y1="11" x2="15.5" y2="11"/><line x1="8.5" y1="15" x2="12.5" y2="15"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>',
    sparkles: '<path d="M11 2.5 L12.6 8.4 L18.5 10 L12.6 11.6 L11 17.5 L9.4 11.6 L3.5 10 L9.4 8.4 Z" fill="currentColor" stroke="none"/><path d="M18.5 15 L19.3 17.7 L22 18.5 L19.3 19.3 L18.5 22 L17.7 19.3 L15 18.5 L17.7 17.7 Z" fill="currentColor" stroke="none"/>',
    family: '<circle cx="8" cy="7" r="2.3"/><path d="M4 20 C4 15.5 6 13 8 13 C10 13 12 15.5 12 20"/><circle cx="16.5" cy="8" r="2"/><path d="M13 20 C13 16 14.5 14 16.5 14 C18.5 14 20 16 20 20"/>',
    heart: '<path d="M12 20 C12 20 4 14 4 8.5 C4 5.5 6.5 4 9 4 C10.5 4 11.5 5 12 6 C12.5 5 13.5 4 15 4 C17.5 4 20 5.5 20 8.5 C20 14 12 20 12 20 Z"/>',
    trash: '<path d="M4 7 H20"/><path d="M9 7 V4 H15 V7"/><path d="M6 7 L7 21 H17 L18 7"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/>'
  };
  function icon(name, size, extra){
    var body = ICON_DEFS[name] || '';
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ' +
      'style="width:'+(size||16)+'px;height:'+(size||16)+'px;flex:none'+(extra?';'+extra:'')+'">'+body+'</svg>';
  }

  // ---------- render: dashboard ----------
  var PINK='#c14a6f', PINK_MID='#e2678c', PINK_300='#ffc2d1', CREAM='#fdf6f5', SURFACE='#f7e6e6', INK='#201e1d';

  function barStyle(d){
    if(d.kind==='future') return {h:3, fill:'#f2dedd'};
    if(d.kind==='rent') return {h:60, fill:PINK_300};
    if(d.kind==='zero') return {h:3, fill:'#eccfce'};
    var h = Math.max(7, Math.round(7 + (d.total/(d.scaleMax||1))*51));
    return { h:h, fill: d.kind==='today' ? PINK : PINK_MID };
  }

  function renderDashboard(){
    var dash = computeDashboard();
    var layout = state.settings.dashboardLayout, bold = state.settings.pinkIntensity==='bold';
    var heroBg = bold?PINK:SURFACE, heroFg = bold?CREAM:INK, heroInner = bold?PINK:CREAM, inkAccent = bold?PINK:INK;
    var trackBg = bold ? 'rgba(253,246,245,.28)' : '#f2dedd', fillBg = bold?CREAM:PINK;
    var pctLabel = Math.round(dash.pct)+'%';
    var ringGradient = 'conic-gradient(' + (bold?CREAM:PINK) + ' 0 ' + dash.pct + '%, ' + (bold?'rgba(253,246,245,.26)':'#f2dedd') + ' ' + dash.pct + '% 100%)';
    var leftLabel = fmt0(Math.max(0, dash.budget-dash.spent));

    var html = '';
    if(layout==='ring'){
      html += '<div class="hero hero-ring" style="background:'+heroBg+';color:'+heroFg+'">' +
        '<div class="ring-wrap" style="background:'+ringGradient+'"><div class="ring-inner" style="background:'+heroInner+'">' +
        '<div class="ring-pct">'+pctLabel+'</div><div class="eyebrow">of budget</div></div></div>' +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:5px">' +
        '<div class="eyebrow-lg">Spent so far</div><div class="amount-lg">'+fmt(dash.spent)+'</div>' +
        '<div style="font-size:13px;opacity:.92;line-height:1.35">of '+fmt0(dash.budget)+' \u00B7 '+leftLabel+' left for '+dash.daysLeft+' day'+(dash.daysLeft===1?'':'s')+'</div>' +
        '</div></div>';
    } else if(layout==='bar'){
      html += '<div class="hero" style="background:'+heroBg+';color:'+heroFg+';display:flex;flex-direction:column;gap:14px">' +
        '<div style="display:flex;align-items:flex-end;gap:10px"><div style="flex:1;min-width:0">' +
        '<div class="eyebrow-lg">Spent this month</div><div style="font-family:var(--display);font-size:36px;line-height:1.05;letter-spacing:-.02em;margin-top:2px">'+fmt(dash.spent)+'</div></div>' +
        '<div style="text-align:right;font-size:12px;opacity:.92;line-height:1.4;padding-bottom:4px">'+leftLabel+'<br>left</div></div>' +
        '<div class="track" style="height:20px;background:'+trackBg+'"><div style="width:'+pctLabel+';background:'+fillBg+'"></div></div>' +
        '<div style="display:flex;justify-content:space-between;font-size:11px;opacity:.85"><span>'+pctLabel+' used</span><span>'+fmt0(dash.budget)+' budget</span></div>' +
        '</div>';
    } else {
      html += '<div style="padding:6px 2px 18px;border-bottom:1px solid var(--ink-hair);display:flex;flex-direction:column;gap:2px">' +
        '<div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:'+inkAccent+';font-weight:600">Spent this month</div>' +
        '<div style="font-family:var(--display);font-size:56px;line-height:.98;letter-spacing:-.03em;color:'+inkAccent+'">'+fmt(dash.spent)+'</div>' +
        '<div style="font-size:14px;color:var(--ink-soft);margin-top:6px;line-height:1.4">'+leftLabel+' of '+fmt0(dash.budget)+' still yours, with '+dash.daysLeft+' days to go.</div>' +
        '<div class="track" style="height:8px;background:#f2dedd;margin-top:14px"><div style="width:'+pctLabel+';background:'+inkAccent+'"></div></div>' +
        '</div>';
    }

    html += '<div class="card-block"><div class="row-between"><div class="h3">Day by day</div><div style="font-size:11px;color:var(--ink-soft)">avg '+fmt0(dash.avgPerDay)+'/day</div></div>' +
      '<div class="bars-row">' + dash.days.map(function(d){ var s=barStyle(d); return '<div style="height:'+s.h+'px;background:'+s.fill+'"></div>'; }).join('') + '</div>' +
      '<div class="axis-row"><span>1 '+dash.monthAbbr+'</span><span>TODAY</span><span>'+dash.lastDay+' '+dash.monthAbbr+'</span></div></div>';

    if(layout==='ring'){
      html += '<div class="card-block" style="flex-direction:row;align-items:center;gap:18px">' +
        '<div class="ring-wrap" style="width:104px;height:104px;background:'+buildDonutGradient(dash.categories)+'">' +
        '<div style="position:absolute;inset:18px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center;line-height:1.2;color:var(--ink-soft)">'+dash.categories.length+'<br>groups</div></div>' +
        '<div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">' +
        dash.categories.map(function(c){ return '<div class="cat-line"><span class="dot" style="background:'+c.color+'"></span><span class="name">'+c.name+'</span><span class="amt">'+fmt(c.amount)+'</span></div>'; }).join('') +
        '</div></div>';
    } else {
      html += '<div style="display:flex;flex-direction:column;gap:14px;padding:4px 2px"><div class="h3">Where it went</div>' +
        dash.categories.map(function(c){ return '<div style="display:flex;flex-direction:column;gap:6px">' +
          '<div style="display:flex;align-items:baseline;gap:8px;font-size:13.5px"><span class="name" style="flex:1">'+c.name+'</span><span class="amt">'+fmt(c.amount)+'</span>' +
          '<span style="font-size:11px;color:var(--ink-faint);width:34px;text-align:right">'+c.pct+'%</span></div>' +
          '<div class="track"><div style="width:'+c.pct+'%;background:'+c.color+'"></div></div></div>'; }).join('') + '</div>';
    }

    html += renderCategoryPies();

    return { html: '<div style="display:flex;flex-direction:column;gap:16px">'+html+'</div>', dash: dash };
  }

  // ---------- render: history ----------
  function renderHistory(){
    var expenses = state.expenses.filter(function(e){ return ui.historyFilter==='All' || e.category===ui.historyFilter; })
      .slice().sort(function(a,b){ return b.date<a.date?-1:(b.date>a.date?1:0); });
    var html = '<div style="display:flex;flex-direction:column;gap:12px">';
    html += '<div style="display:flex;gap:8px;flex-wrap:wrap">';
    ['All'].concat(CATS).forEach(function(f){
      html += '<button type="button" class="filter-chip'+(ui.historyFilter===f?' active':'')+'" data-action="setFilter" data-value="'+f+'">'+f+'</button>';
    });
    html += '</div>';

    if(expenses.length===0){ html += '<div class="empty-state">No transactions in this category yet.</div>'; }

    var lastLabel = null;
    expenses.forEach(function(t){
      var label = dateLabel(t.date); var showDate = label!==lastLabel; lastLabel = label;
      var meta = CAT_META[t.category] || CAT_META[CATS[0]];
      var isFresh = ui.freshId===t.id;
      var sub = t.category + (t.paymentMethod ? ' \u00B7 ' + t.paymentMethod : '');
      html += '<div style="display:flex;flex-direction:column;gap:8px">';
      if(showDate) html += '<div class="date-label">'+label+'</div>';
      html += '<div class="txn-row'+(isFresh?' fresh':'')+'"><div class="icon-badge" style="background:'+meta.tint+'">'+icon(meta.icon,17)+'</div>' +
        '<div style="flex:1;min-width:0"><div class="txn-name">'+escapeHtml(t.supplier||'Untitled')+'</div><div class="txn-sub">'+sub+'</div>'+
        (t.comment ? '<div class="txn-sub" style="font-style:italic;margin-top:2px">'+escapeHtml(t.comment)+'</div>' : '')+'</div>' +
        '<div class="txn-amt">-'+fmt(t.amount)+'</div>' +
        '<button type="button" class="delete-btn" data-action="deleteExpense" data-value="'+t.id+'" aria-label="Delete">'+icon('trash',15)+'</button>' +
        '</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- render: category pies (dashboard) ----------
  function renderCategoryPies(){
    var data = computeBudgets();
    var R = 34, CX = 40, CY = 40;
    var html = '<div><div class="h3" style="margin-bottom:2px">Budget by category</div>' +
      '<div style="font-size:11px;color:var(--ink-soft);margin-bottom:12px">Tap a slice for the amount</div>' +
      '<div class="pies-grid">';
    data.categories.forEach(function(c){
      var meta = CAT_META[c.name] || CAT_META[CATS[0]];
      var over = c.spent > c.cap;
      var spentShare = c.cap > 0 ? Math.min(1, c.spent / c.cap) : (c.spent > 0 ? 1 : 0);
      var spentDeg = spentShare * 360;
      var spentColor = over ? '#9a3454' : meta.color;
      var key = escapeHtml(c.name);
      var svg = '<svg viewBox="0 0 80 80" style="width:76px;height:76px" aria-hidden="true">';
      if(over || spentDeg >= 359.99){
        svg += '<path d="'+pieSlicePath(CX,CY,R,0,360)+'" fill="'+spentColor+'" data-action="selectPieSlice" data-value="'+key+'|spent" style="cursor:pointer"></path>';
      } else {
        svg += '<path d="'+pieSlicePath(CX,CY,R,0,spentDeg)+'" fill="'+spentColor+'" data-action="selectPieSlice" data-value="'+key+'|spent" style="cursor:pointer"></path>';
        svg += '<path d="'+pieSlicePath(CX,CY,R,spentDeg,360)+'" fill="var(--track)" data-action="selectPieSlice" data-value="'+key+'|remaining" style="cursor:pointer"></path>';
      }
      svg += '</svg>';

      var sel = ui.pieSelection[c.name];
      var info;
      if(sel==='spent') info = '<span style="color:'+spentColor+';font-weight:600">'+fmt(c.spent)+' spent</span>';
      else if(sel==='remaining') info = over
        ? '<span style="color:#9a3454;font-weight:600">'+fmt(c.spent-c.cap)+' over</span>'
        : '<span style="font-weight:600">'+fmt(c.cap-c.spent)+' left</span>';
      else info = '<span>'+fmt0(c.cap)+' budget</span>';

      html += '<div class="pie-card">' + svg +
        '<div class="pie-name">'+icon(meta.icon,13,'vertical-align:-2px;margin-right:4px;color:'+meta.color)+c.name+'</div>' +
        '<div class="pie-info">'+info+'</div></div>';
    });
    html += '</div></div>';
    return html;
  }

  // ---------- render: budgets ----------
  function renderBudgets(){
    var data = computeBudgets();
    var html = '<div style="display:flex;flex-direction:column;gap:18px">';
    html += '<div style="border-radius:28px;padding:18px 20px;background:var(--surface);display:flex;align-items:center;gap:14px">' +
      '<div style="flex:1;min-width:0"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)">Monthly income (reference)</div>' +

  // ---------- render: insights ----------
  function toneColors(tone, bold){
    if(tone==='hero') return { bg: bold?PINK:SURFACE, fg: bold?CREAM:INK };
    if(tone==='pink-100') return { bg:'#fff1f4', fg:INK };
    if(tone==='sage') return { bg:'#f0fae1', fg:'#3d472b' };
    return { bg:SURFACE, fg:INK };
  }
  function renderInsights(insights){
    var bold = state.settings.pinkIntensity==='bold';
    var html = '<div style="display:flex;flex-direction:column;gap:14px">';

      var c = toneColors(n.tone, bold);
      html += '<div class="insight-card" style="background:'+c.bg+';color:'+c.fg+'">' +
        '<div class="insight-head">'+icon(n.icon,17)+'<span class="insight-kicker">'+n.kicker+'</span></div>' +
        '<div class="insight-title">'+n.head+'</div><div class="insight-body">'+n.body+'</div></div>';
    });
    html += '</div>';
    return html;
  }

  // ---------- render: log sheet ----------
  function renderLogSheet(){
    if(!ui.sheetOpen) return '';
    var recents = state.expenses.slice().sort(function(a,b){ return b.date<a.date?-1:(b.date>a.date?1:0); }).slice(0,3);
    var html = '<div class="sheet-backdrop"><div class="sheet-scrim" data-action="closeSheet"></div><div class="sheet"><div class="grabber"></div>';
    html += '<div style="display:flex;flex-direction:column;gap:16px">';
    html += '<div class="field-label" style="margin-bottom:0">New expense</div>';

    html += '<div style="display:flex;gap:10px">' +
      '<label style="display:block;flex:1.3"><span class="field-label">Amount (\u20AC)</span>' +
      '<input class="field-input" style="font-family:var(--display);font-size:30px;color:var(--pink);padding:10px 14px" ' +
      'type="number" inputmode="decimal" min="0" step="0.01" value="'+escapeHtml(ui.amount)+'" data-field="amount" placeholder="0.00"></label>' +
      '<label style="display:block;flex:1"><span class="field-label">Date</span>' +
      '<input class="field-input" style="padding:10px 12px;font-size:14px" type="date" value="'+escapeHtml(ui.date)+'" data-field="date"></label>' +
      '</div>';

    if(recents.length){
      html += '<div style="display:flex;flex-direction:column;gap:8px"><span class="field-label" style="margin-bottom:0">Repeat a recent one</span>' +
        '<div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:2px">';
      recents.forEach(function(r){
        var meta = CAT_META[r.category] || CAT_META[CATS[0]];
        html += '<button type="button" class="recent-btn" style="width:auto;flex:none" data-action="selectRecent" data-value="'+r.id+'">' +
          '<span class="recent-badge" style="background:'+meta.tint+'">'+icon(meta.icon,15)+'</span>' +
          '<span style="font-size:12.5px;font-weight:600;white-space:nowrap">'+escapeHtml(r.supplier||r.category)+'</span></button>';
      });
      html += '</div></div>';
    }

    html += '<div><span class="field-label">Category</span><div class="chip-grid">';
    CATS.forEach(function(c){ var meta=CAT_META[c]; var on = ui.category===c;
      html += '<button type="button" class="chip-btn'+(on?' active':'')+'" data-action="selectCategory" data-value="'+c+'">'+icon(meta.icon,18)+'<span>'+c+'</span></button>'; });
    html += '</div></div>';

    html += '<div><span class="field-label">Payment method</span><div class="chip-row-scroll">';
    PAYMENT_METHODS.forEach(function(p){ var on = ui.paymentMethod===p;
      html += '<button type="button" class="chip-row-btn'+(on?' active':'')+'" data-action="selectPayment" data-value="'+p+'"><span>'+p+'</span></button>'; });
    html += '</div></div>';

    html += '<label style="display:block"><span class="field-label">Supplier / description</span>' +
      '<input class="field-input" type="text" value="'+escapeHtml(ui.supplier)+'" data-field="supplier" placeholder="e.g. Esselunga"></label>';

    html += '<label style="display:block"><span class="field-label">Comment (optional)</span>' +
      '<input class="field-input" type="text" value="'+escapeHtml(ui.comment)+'" data-field="comment" placeholder="Optional note"></label>';

    html += '</div>';

    html += '<div class="sheet-actions"><button type="button" class="btn-ghost btn-cancel" data-action="closeSheet">Cancel</button>' +
      '<button type="button" class="btn-pill btn-save" data-action="saveExpense">'+icon('check',17)+'Save expense</button></div>';

    html += '</div></div>';
    return html;
  }

  // ---------- render: settings sheet ----------
  var SETTINGS_SECTIONS = [
    { key:'dashboardLayout', title:'Dashboard hero', options:[{v:'ring',l:'Budget ring'},{v:'bar',l:'Budget bar'},{v:'editorial',l:'Editorial number'}] },
    { key:'pinkIntensity', title:'Pink intensity', options:[{v:'bold',l:'Bold'},{v:'restrained',l:'Restrained'}] }
  ];
  function renderSettingsSheet(){
    if(!ui.settingsOpen) return '';
    var html = '<div class="sheet-backdrop"><div class="sheet-scrim" data-action="closeSettings"></div><div class="sheet"><div class="grabber"></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
      '<div style="font-family:var(--display);font-size:21px">Appearance</div>' +
      '<button type="button" class="gear-btn" data-action="closeSettings">'+icon('x',15)+'</button></div>';
    SETTINGS_SECTIONS.forEach(function(sec){
      html += '<div style="display:flex;flex-direction:column;gap:9px;margin-bottom:18px"><div class="field-label">'+sec.title+'</div><div style="display:flex;gap:8px;flex-wrap:wrap">';
      sec.options.forEach(function(o){
        var active = state.settings[sec.key]===o.v;
        html += '<button type="button" class="pill-option'+(active?' active':'')+'" data-action="setSetting" data-value="'+sec.key+':'+o.v+'">'+o.l+'</button>';
      });
      html += '</div></div>';
    });

    html += '<div style="display:flex;flex-direction:column;gap:9px;padding-top:6px;border-top:1px solid var(--ink-hair)">' +
      '<div class="field-label" style="margin-top:12px">Google Sheet sync</div>' +
      '<div style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:2px">Paste the Apps Script Web App URL (ends in /exec) for the Transactions tab. The app loads your transactions from this Sheet on open, and every add or delete here updates it too \u2014 your Sheet is the real copy, this phone just caches it.</div>' +
      '<input class="field-input" type="url" value="'+escapeHtml(ui.settingsDraft.syncUrl)+'" data-field="syncUrl" placeholder="https://script.google.com/macros/s/.../exec">' +
      '<div style="display:flex;gap:8px;margin-top:6px">' +
      '<button type="button" class="btn-pill btn-save" data-action="saveSyncUrl" style="flex:1;padding:12px 0;font-size:13.5px">'+icon('check',15)+'Save endpoint</button>' +
      (state.settings.syncUrl ? '<button type="button" class="btn-ghost" data-action="refreshFromSheet" style="padding:12px 16px;font-size:13.5px">Refresh now</button>' : '') +
      '</div>' +
      (state.settings.syncUrl ? '<div style="font-size:11.5px;color:var(--ink-soft)">Connected \u2014 syncing to your saved endpoint.</div>' : '<div style="font-size:11.5px;color:var(--ink-soft)">Not connected yet \u2014 entries are only saved on this phone.</div>') +
      '</div>';

    html += '</div></div>';
    return html;
  }

  // ---------- render: adjust sheet ----------
  function renderAdjustSheet(){
    if(!ui.adjustOpen) return '';
    var d = ui.adjustDraft;
    var pctTotal = 0; Object.keys(d.categoryPct).forEach(function(k){ pctTotal += (Number(d.categoryPct[k])||0); });
    var html = '<div class="sheet-backdrop"><div class="sheet-scrim" data-action="closeAdjust"></div><div class="sheet"><div class="grabber"></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">' +
      '<div style="font-family:var(--display);font-size:21px">Adjust plan</div>' +
      '<button type="button" class="gear-btn" data-action="closeAdjust">'+icon('x',15)+'</button></div>' +
      '<div style="font-size:12.5px;color:var(--ink-soft);line-height:1.5;margin-bottom:14px">Reference baseline from your Targets tab. The spreadsheet itself recalculates each month\'s real target from that month\'s actual income \u2014 this local copy just uses a fixed monthly income.</div>' +
      '<label style="display:block;margin-bottom:16px"><span class="field-label">Monthly income (\u20AC)</span>' +
      '<input class="field-input" type="number" min="0" step="1" value="'+d.monthlyIncome+'" data-field="monthlyIncome"></label>' +
      '<div class="field-label">Category % of income</div><div style="display:flex;flex-direction:column;gap:10px;margin:8px 0 8px">';
    CATS.forEach(function(c){
      html += '<div style="display:flex;align-items:center;gap:10px"><span style="flex:1;font-size:13.5px;font-weight:600">'+c+'</span>' +
        '<input class="cap-input" style="width:64px" type="number" min="0" step="0.5" value="'+d.categoryPct[c]+'" data-field="pct" data-cat="'+c+'">' +
        '<span style="font-size:12px;color:var(--ink-faint)">%</span></div>';
    });
    html += '</div><div style="font-size:11.5px;color:var(--ink-soft);text-align:right">'+pctTotal+'% of income allocated (should be ~100%)</div>' +
      '<div class="sheet-actions"><button type="button" class="btn-ghost btn-cancel" data-action="closeAdjust">Cancel</button>' +
      '<button type="button" class="btn-pill btn-save" data-action="saveAdjust">'+icon('check',17)+'Save plan</button></div></div></div>';
    return html;
  }

  // ---------- top-level render ----------
  var TITLES = {
    dash: function(dash){ return { kicker: greeting(), title: dash.monthLabel + ' so far' }; },
    history: function(){ return { kicker:'Every euro', title:'Transactions' }; },
    budgets: function(){ return { kicker:'The plan', title:'Budgets' }; },
    insights: function(){ return { kicker:'Patterns', title:'Worth knowing' }; }
  };
  var TABS = [
    {id:'dash', label:'Home', icon:'layout-dashboard'},
    {id:'history', label:'History', icon:'receipt-text'},
    {id:'budgets', label:'Budgets', icon:'target'},
    {id:'insights', label:'Insights', icon:'sparkles'}
  ];

  function render(){
    var dashResult = renderDashboard();
    var insights = computeInsights(dashResult.dash);

    var head = TITLES[ui.tab](dashResult.dash);
    var body;
    if(ui.tab==='dash') body = dashResult.html;
    else if(ui.tab==='history') body = renderHistory();
    else if(ui.tab==='budgets') body = renderBudgets();
    else body = renderInsights(insights);

    var html = '';
    html += '<div class="topbar"><div style="flex:1;min-width:0"><div class="kicker">'+head.kicker+'</div><div class="title">'+head.title+'</div></div>' +
      '<button type="button" class="gear-btn" data-action="openSettings">'+icon('settings-2',15)+'</button></div>';
    var banner = ui.syncStatus ? '<div style="margin:0 0 12px;padding:9px 14px;border-radius:14px;background:var(--surface);font-size:12px;color:var(--ink-soft);text-align:center">'+ui.syncStatus+'</div>' : '';
    html += '<div class="scroll">'+banner+body+'</div>';
    html += '<button type="button" class="fab" data-action="openSheet" aria-label="Log an expense">'+icon('plus',26)+'</button>';
    html += '<div class="tabbar">';
    TABS.forEach(function(t){
      html += '<button type="button" class="tab-btn'+(ui.tab===t.id?' active':'')+'" data-action="setTab" data-value="'+t.id+'">'+icon(t.icon,21)+'<span>'+t.label+'</span></button>';
    });
    html += '</div>';
    html += renderLogSheet() + renderSettingsSheet() + renderAdjustSheet();

    var card = document.getElementById('card');
    card.innerHTML = html;
  }

  // ---------- Google Sheet sync ----------
  // JSONP, not fetch(): Apps Script Web Apps don't return CORS headers, so a normal
  // cross-origin fetch() can't read the response (and mode:'no-cors' makes it unreadable
  // on purpose). A <script src> tag isn't subject to CORS, so the Apps Script side wraps
  // its JSON reply as `callbackName({...})` and this just executes it.
  function jsonpRequest(params, timeoutMs){
    return new Promise(function(resolve, reject){
      var cbName = 'bloomCb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
      var script = document.createElement('script');
      var done = false;
      var timeoutId = setTimeout(function(){ finish(function(){ reject(new Error('timeout')); }); }, timeoutMs || 12000);
      function finish(fn){
        if(done) return; done = true;
        clearTimeout(timeoutId);
        delete window[cbName];
        if(script.parentNode) script.parentNode.removeChild(script);
        fn();
      }
      window[cbName] = function(data){ finish(function(){ resolve(data); }); };
      script.onerror = function(){ finish(function(){ reject(new Error('network error')); }); };
      var qs = Object.keys(params).map(function(k){ return encodeURIComponent(k) + '=' + encodeURIComponent(params[k]); }).join('&');
      var sep = state.settings.syncUrl.indexOf('?') >= 0 ? '&' : '?';
      script.src = state.settings.syncUrl + sep + qs + '&callback=' + cbName;
      document.head.appendChild(script);
    });
  }
  function scheduleClearSyncStatus(){
    setTimeout(function(){ ui.syncStatus = null; render(); }, 3500);
  }
  function refreshFromSheet(){
    if(!state.settings.syncUrl) return;
    ui.syncStatus = 'Loading from Google Sheet\u2026'; render();
    jsonpRequest({ token: SYNC_TOKEN, action: 'list' })
      .then(function(res){
        if(!res || !res.ok) throw new Error((res && res.error) || 'list failed');
        var serverItems = res.items.map(function(it){ return Object.assign({}, it, { synced: true }); });
        var serverIds = {}; serverItems.forEach(function(it){ serverIds[it.id] = true; });
        // anything logged on this device that never got confirmed as written (network hiccup,
        // or predates this sync feature) survives the refresh and gets one more send attempt --
        // otherwise "local storage is disposable" would risk losing not-yet-synced entries.
        var pendingLocal = state.expenses.filter(function(e){ return e.synced !== true && !serverIds[e.id]; });
        state.expenses = serverItems.concat(pendingLocal);
        persist(state);
        ui.syncStatus = null; render();
        pendingLocal.forEach(function(e){ trySyncCreate(e); });
      })
      .catch(function(){
        ui.syncStatus = 'Could not reach your Google Sheet \u2014 showing the last saved copy on this device.';
        render(); scheduleClearSyncStatus();
      });
  }
  function trySyncCreate(expense){
    jsonpRequest({
      token: SYNC_TOKEN, action: 'create', id: expense.id, date: expense.date, category: expense.category,
      supplier: expense.supplier, amount: expense.amount, paymentMethod: expense.paymentMethod, comment: expense.comment
    }).then(function(res){
      if(res && res.ok){
        var e = state.expenses.filter(function(x){ return x.id===expense.id; })[0];
        if(e){ e.synced = true; persist(state); }
      }
    }).catch(function(){ /* stays unsynced locally; retried on next load */ });
  }
  function syncCreateExpense(expense){
    if(!state.settings.syncUrl){
      ui.syncStatus = 'Saved locally only \u2014 no Google Sheet endpoint set (Settings \u2192 Google Sheet sync).';
      render(); scheduleClearSyncStatus(); return;
    }
    ui.syncStatus = 'Saving to Google Sheet\u2026'; render();
    jsonpRequest({
      token: SYNC_TOKEN, action: 'create', id: expense.id, date: expense.date, category: expense.category,
      supplier: expense.supplier, amount: expense.amount, paymentMethod: expense.paymentMethod, comment: expense.comment
    }).then(function(res){
      if(res && res.ok){
        expense.synced = true; persist(state);
        ui.syncStatus = 'Saved to your Google Sheet.';
      } else {
        ui.syncStatus = 'Saved locally \u2014 the Sheet rejected it (' + ((res && res.error) || 'unknown error') + ').';
      }
      render(); scheduleClearSyncStatus();
    }).catch(function(){
      ui.syncStatus = 'Saved locally \u2014 could not reach the Sheet (will retry next time you open the app).';
      render(); scheduleClearSyncStatus();
    });
  }
  function syncDeleteExpense(expense){
    if(!state.settings.syncUrl || expense.synced !== true) return;
    jsonpRequest({ token: SYNC_TOKEN, action: 'delete', id: expense.id })
      .then(function(res){
        if(!res || !res.ok){
          ui.syncStatus = 'Removed locally \u2014 could not remove it from the Sheet (' + ((res && res.error) || 'not found') + ').';
          render(); scheduleClearSyncStatus();
        }
      })
      .catch(function(){
        ui.syncStatus = 'Removed locally \u2014 could not reach the Sheet to remove it there too.';
        render(); scheduleClearSyncStatus();
      });
  }
  function commitSyncUrl(){
    var next = (ui.settingsDraft.syncUrl || '').trim();
    if(next === state.settings.syncUrl) return;
    state.settings.syncUrl = next;
    persist(state);
    refreshFromSheet();
  }

  var ACTIONS = {
    setTab: function(v){ ui.tab = v; render(); },
    openSheet: function(){ ui.date = todayIso(); ui.sheetOpen = true; render(); },
    closeSheet: function(){ ui.sheetOpen = false; ui.amount=''; ui.supplier=''; ui.comment=''; render(); },
    selectCategory: function(v){ ui.category = v; render(); },
    selectPayment: function(v){ ui.paymentMethod = v; render(); },
    selectRecent: function(v){
      var r = state.expenses.filter(function(e){ return String(e.id)===String(v); })[0];
      if(r){ ui.amount = r.amount.toFixed(2); ui.category = r.category; ui.supplier = r.supplier || ''; ui.paymentMethod = r.paymentMethod || ui.paymentMethod; }
      render();
    },
    saveExpense: function(){
      var amt = parseFloat(ui.amount || '0');
      if(!amt){ ACTIONS.closeSheet(); return; }
      var created = {
        id: newId(), date: ui.date || todayIso(),
        supplier: (ui.supplier || '').trim() || ui.category, category: ui.category, amount: round2(amt),
        paymentMethod: ui.paymentMethod, comment: (ui.comment || '').trim(), synced: false
      };
      state.expenses.push(created);
      persist(state);
      ui.sheetOpen = false; ui.amount = ''; ui.supplier = ''; ui.comment = ''; ui.tab = 'dash'; ui.freshId = created.id;
      render();
      setTimeout(function(){ ui.freshId = null; render(); }, 1200);
      syncCreateExpense(created);
    },
    openSettings: function(){ ui.settingsDraft = { syncUrl: state.settings.syncUrl || '' }; ui.settingsOpen = true; render(); },
    closeSettings: function(){ ui.settingsOpen = false; render(); },
    setSetting: function(v){
      var parts = v.split(':'); state.settings[parts[0]] = parts[1]; persist(state); render();
    },
    saveSyncUrl: function(){ commitSyncUrl(); },
    refreshFromSheet: function(){ refreshFromSheet(); },
    setFilter: function(v){ ui.historyFilter = v; render(); },
    selectPieSlice: function(v){
      var idx = v.lastIndexOf('|');
      var cat = v.slice(0, idx), kind = v.slice(idx+1);
      ui.pieSelection[cat] = ui.pieSelection[cat]===kind ? null : kind;
      render();
    },
    deleteExpense: function(v){
      var e = state.expenses.filter(function(x){ return String(x.id)===String(v); })[0];
      if(!e) return;
      var label = (e.supplier||e.category) + ' \u2014 ' + fmt(e.amount) + ' (' + e.date + ')';
      var willAlsoRemoveFromSheet = !!state.settings.syncUrl && e.synced === true;
      var msg = 'Delete "' + label + '"?\n\n' + (willAlsoRemoveFromSheet
        ? 'This also removes it from your Google Sheet.'
        : 'This only removes it from this app (it was never confirmed in your Google Sheet).');
      var ok = confirm(msg);
      if(!ok) return;
      state.expenses = state.expenses.filter(function(x){ return String(x.id)!==String(v); });
      persist(state);
      render();
      syncDeleteExpense(e);
    },
    openAdjust: function(){
      ui.adjustDraft = { monthlyIncome: state.monthlyIncome, categoryPct: Object.assign({}, state.categoryPct) };
      ui.adjustOpen = true; render();
    },
    closeAdjust: function(){ ui.adjustOpen = false; render(); },
    saveAdjust: function(){
      var d = ui.adjustDraft;
      state.monthlyIncome = Number(d.monthlyIncome) || state.monthlyIncome;
      Object.keys(d.categoryPct).forEach(function(c){ var n = Number(d.categoryPct[c]); if(isFinite(n) && n>=0) state.categoryPct[c] = n; });
      persist(state);
      ui.adjustOpen = false; render();
    }
  };

  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-action]');
    if(!el) return;
    var fn = ACTIONS[el.dataset.action];
    if(fn) fn(el.dataset.value, el);
  });

  document.addEventListener('input', function(e){
    var el = e.target;
    if(!el.matches('[data-field]')) return;
    var field = el.dataset.field;
    if(ui.sheetOpen && (field==='amount' || field==='supplier' || field==='comment' || field==='date')){ ui[field] = el.value; return; }
    if(ui.settingsOpen && ui.settingsDraft && field==='syncUrl'){ ui.settingsDraft.syncUrl = el.value; return; }
    if(ui.adjustDraft){
      if(field==='monthlyIncome') ui.adjustDraft.monthlyIncome = el.value;
      else if(field==='pct') ui.adjustDraft.categoryPct[el.dataset.cat] = el.value;
    }
  }, true);

  // Safety net: persist the sync URL the moment the field loses focus (keyboard dismissed,
  // tapped elsewhere), not only on an explicit "Save endpoint" tap -- a missed tap there was
  // the likeliest reason sync silently did nothing with no error shown.
  document.addEventListener('blur', function(e){
    var el = e.target;
    if(el.matches && el.matches('[data-field="syncUrl"]') && ui.settingsDraft){
      commitSyncUrl();
    }
  }, true);

  // ---------- boot ----------
  state = loadState();
  render();
  refreshFromSheet();
})();
</script>
</body>
</html>
